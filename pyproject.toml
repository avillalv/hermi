[project]
name = "hermi-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.uv.sources]
hermi-api = { workspace = true }
hermi-worker = { workspace = true }

[dependency-groups]
dev = ["hermi-api", "hermi-worker", "pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hermi", "hermi_worker"]
