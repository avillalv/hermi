<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermi: Plan together. Know the fare.</title>
<meta name="description" content="Hermi is a trip planner for you and the people you travel with. Build the plan together and see what flights really cost. Join the waitlist.">
<meta name="theme-color" content="#2AA5FF">
<link rel="icon" href="hermi-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="landing.css">
</head>
<body data-api-url="">
<main>
<p class="brand"><picture><source media="(prefers-color-scheme: dark)" srcset="hermi-logo-dark.svg"><img src="hermi-logo.svg" alt="Hermi" width="295" height="122"></picture></p>
<h1><span>Plan together.</span><span>Know the fare.</span></h1>
<p class="lead">Build a trip with the people you are going with, and see what flights really cost. Join the waitlist and we will email you once when Hermi opens.</p>
<form id="waitlist" method="post" action="#" novalidate>
<label>Email<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
<label>Who do you plan trips with?<select name="who"><option value="">Choose one</option><option>Partner</option><option>Family</option><option>Friends</option><option>Colleagues</option><option>Mostly solo</option></select></label>
<label>Which app do you use today?<input type="text" name="current_app" maxlength="100" placeholder="Spreadsheet, notes, another app"></label>
<button type="submit">Join the waitlist</button>
<p id="status" role="status" aria-live="polite"></p>
<p class="fine">We use your email only for the waitlist. Read the <a href="privacy.html">Privacy policy</a>.</p>
</form>
</main>
<script src="landing.js" defer></script>
</body>
</html>
