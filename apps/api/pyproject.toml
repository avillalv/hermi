[project]
name = "hermi-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.32",
    "alembic>=1.14",
    "PyJWT[crypto]>=2.10",
    "sqlalchemy>=2.0",
]

[project.scripts]
hermi = "hermi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["posix_only: test needs a POSIX system and is skipped on win32"]
