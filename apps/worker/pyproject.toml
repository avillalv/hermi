[project]
name = "hermi-worker"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["hermi-api"]

[tool.uv.sources]
hermi-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermi_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["posix_only: test needs a POSIX system and is skipped on win32"]
