          <button class="h-action" type="button" aria-pressed="false" aria-label="Verify another AI's plan, costs 1 credit to read it, then 1 credit for each place checked"><span class="h-action__text"><span class="h-action__title">Verify another AI's plan</span><span class="h-action__desc">5 places at a time on Free</span></span><span class="h-action__side"><span class="h-credit"><svg class="h-icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-coins"></use></svg><span class="h-credit__n">1</span> credit, then 1 each</span></span></button>
          <button class="h-action" type="button" aria-pressed="false" aria-label="Live check, costs 1 credit"><span class="h-action__text"><span class="h-action__title">Live check</span><span class="h-action__desc">A flight or a rental</span></span><span class="h-action__side"><span class="h-credit"><svg class="h-icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-coins"></use></svg><span class="h-credit__n">1</span> credit</span></span></button>
          <button class="h-action" type="button" aria-pressed="false" aria-label="Recheck a finding, costs 1 credit"><span class="h-action__text"><span class="h-action__title">Recheck a finding</span><span class="h-action__desc">Older than 14 days</span></span><span class="h-action__side"><span class="h-credit"><svg class="h-icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-coins"></use></svg><span class="h-credit__n">1</span> credit</span></span></button>
        </div>
        <div class="h-confirm" role="group" aria-labelledby="cf-h">
          <h3 class="h-confirm__title" id="cf-h">Research this question?</h3>
          <p class="h-confirm__text">Costs <span class="h-num">8</span> credits. You have <span class="h-num">12</span>, so <span class="h-num">4</span> left.</p>
          <div class="h-confirm__actions">
            <button class="h-btn h-btn--primary h-btn--spend" type="button" aria-label="Start research, costs 8 credits">Start research<span class="h-credit"><svg class="h-icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#i-coins"></use></svg><span class="h-credit__n">8</span> credits</span></button>
            <button class="h-btn h-btn--secondary" type="button">Cancel</button>
          </div>
        </div>
      </div>
    </main>
