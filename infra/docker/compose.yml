# WF-008. Optional local services plus the API image the CI smoke test runs.
# Throwaway development passwords only. The api uses the roles from infra/db/bootstrap.sql, so run
# that first (the CI smoke test does). Run: docker compose -f infra/docker/compose.yml up --build
name: hermi
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hermi-dev
      MINIO_ROOT_PASSWORD: hermi-dev-password
    ports: ["9000:9000", "9001:9001"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: hermi:ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ci
      AI_PROVIDER: fake
      PROVIDERS_MODE: fake
      AUTH_MODE: dev
      ADMIN_AUTH_MODE: dev
      EMAIL_BACKEND: console
      STORAGE_BACKEND: local
      SCHEDULER_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://hermi_api_login:ci-throwaway@postgres:5432/hermi
      MIGRATION_DATABASE_URL: postgresql+psycopg://hermi_migrate_login:ci-throwaway@postgres:5432/hermi
    ports: ["8100:8100"]
